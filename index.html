<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>プロ野球チームをつくろう！ADV 通算成績</title>
<style>
:root{--bg:#f4f6f2;--card:#fff;--ink:#1d2a1d;--sub:#5d6b5d;--acc:#2f7d32;--acc2:#e8f3e8;--line:#dde3dd;--warn:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:var(--acc);color:#fff;padding:12px 14px 8px}
header h1{font-size:17px;margin:0 0 2px}
header .s{font-size:12px;opacity:.85}
nav{display:flex;overflow-x:auto;gap:4px;background:var(--acc);padding:0 8px 8px;position:sticky;top:0;z-index:5}
nav button{flex:0 0 auto;border:0;border-radius:16px;padding:7px 13px;background:rgba(255,255,255,.18);color:#fff;font-size:14px}
nav button.on{background:#fff;color:var(--acc);font-weight:700}
main{padding:10px}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card h2{font-size:15px;margin:0 0 8px}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:#fff;font-size:15px;margin:3px 4px 3px 0}
.btn.sub{background:var(--acc2);color:var(--acc)}
.btn.warn{background:#fdecea;color:var(--warn)}
input[type=text],select{font-size:15px;padding:8px;border:1px solid var(--line);border-radius:8px;max-width:100%}
.seg{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.seg button{border:1px solid var(--acc);background:#fff;color:var(--acc);border-radius:16px;padding:5px 12px;font-size:14px}
.seg button.on{background:var(--acc);color:#fff}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;font-size:13px;white-space:nowrap;width:max-content;min-width:100%}
th,td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:right}
th{background:#eef2ee;position:sticky;top:0;font-weight:600;cursor:pointer}
th.sorted{color:var(--acc)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1}
th:first-child{background:#eef2ee;z-index:2}
tr.tot td{font-weight:700;background:#f6faf6}
tr.tot td:first-child{background:#f6faf6}
.muted{color:var(--sub);font-size:12px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:8px;background:#fff3e0;color:#a15c00;margin-left:4px}
.unk{color:var(--warn)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.list div{padding:7px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:6px}
a.pl{color:var(--acc);text-decoration:none}
.hide{display:none}
</style>
</head>
<body>

// トレード評価（ROM 0x0800780c / 0x08007af8 を再現）。相手球団の同ポジ人数・レギュラー補正は含まない
function tradeVal(u16,p,info,age){const ty=info.pos===0?0:info.pos===1?2:1;const D=x=>Math.floor(x/100);
  const apt=[0,1,2,3,4,5,6].map(k=>u16(p+0x5c+2*k)).sort((a,b)=>b-a);
  const ar=[0,1,2,3,4,5,6].map(k=>u16(p+0x24+2*k));let sb=0;
  for(let i=0;i<7;i++)for(let j=i+1;j<7;j++)if(ar[i]<ar[j]){const t=ar[i];ar[i]=ar[j];ar[j]=t;if(i===0)sb=j}
  const bs=Math.floor((ar[0]*25+ar[1]*15+(ar[2]+ar[3]+ar[4]+ar[5])*5)/60)&0xffff;
  const thr=(info.mk>>sb)&1?60:0;const top=D(ar[0])>=thr?ar[0]:0;
  const f5=((((3*u16(p+0x46))&0xffff)+u16(p+0x48))&0xffff)>>2;
  const F=[u16(p+0x34),u16(p+0x32),u16(p+0x36),bs,top,f5,u16(p+0x4a),u16(p+0x4c),u16(p+0x4e),u16(p+0x58),u16(p+0x56),apt[0],apt[1],apt[2],u16(p+0x54),u16(p+0x38)].map(D);F.push(info.pop||0);

  return{r,m:Math.round(mul/655.36)/100,v:Math.floor(r*mul/65536)}}

// 直した名前から未知の文字を覚える（文字数が合うときだけ）
function learn(codes,v){if(!codes||!codes.length)return 0;const cs=codes.filter(c=>c!==0x111);const ch=[...v.replace(/[\s\u3000]/g,'')];if(cs.length!==ch.length)return 0;let n=0;cs.forEach((c,i)=>{if(!GLYPH[c]&&ch[i]!=='□'&&GLY[c]!==ch[i]){GLY[c]=ch[i];n++}});if(n)saveGly();return n}

async function gunzip(buf){const u=new Uint8Array(buf);if(u[0]!==0x1f||u[1]!==0x8b)return u;const s=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));return new Uint8Array(await new Response(s).arrayBuffer())}
function parseState(d){

  const sig=String.fromCharCode(...d.slice(4,15));
  if(sig!=='YAKUTUKUADV')throw new Error('このゲームのステートではないようです（.jg1〜を選んでください）');
  const u16=o=>dv.getUint16(o,true),u32=o=>dv.getUint32(o,true);
  const tab=romTab();const out=[];
  for(let t=0;t<NTEAM;t++)for(let k=0;k<25;k++){
    const p=TB+t*TS+k*RS;if(p+RS>d.length)continue;
    const dp=u32(p);let info=null,key;
    if(dp>>>24===8){info=tab.get(dp);if(!info)continue;key='r'+dp.toString(16)}
    else if(dp>>>24===2){const o=EW+dp-0x2000000;if(o<0||o+80>d.length)continue;const np=u32(o+4);let codes=[];
      if(np>>>24===2){let q=EW+np-0x2000000;for(let i=0;i<14;i++){const x=u16(q+2*i);if(x===0x9900)break;codes.push(x)}}
      else if(np>>>24===8){const e=tab.get(dp);codes=e?e.codes:[]}
      info={pos:d[o+65],codes,gt:d[o+19],rk:d[o+0x42],pop:Math.floor(u16(o+0x54)/100),mk:[0,1,2,3,4,5,6].reduce((a,i)=>a|(d[o+0x38+i]?1<<i:0),0)};key='n'+codes.map(c=>c.toString(16)).join('.')}
    else continue;
    const G=u16(p+170);
    const tv=tradeVal(u16,p,info,d[p+10]);
    out.push({key,team:t,id:u16(p+8),age:d[p+10],rng:d[p+79]+d[p+89],ab:ABO.map(o=>Math.round((d[p+o]+d[p+o-1]/256)*10)/10),gt:info.gt,apt:[0,1,2,3,4,5].map(k=>d[p+95+2*k]),pos:info.pos,codes:info.codes,tv,pa:info.pos===0?pitAb(u16,p):undefined,gname:decode(info.codes),
      G,
      pit:{W:d[p+132],L:d[p+133],S:d[p+134],K:u16(p+138),outs:u16(p+140),H:u16(p+142),BB:u16(p+144),ER:u16(p+146),R:u16(p+148),HR:u16(p+150)},
      bat:{PA:u16(p+152),H:u16(p+154),RBI:u16(p+156),SB:u16(p+158),K:u16(p+160),BB:u16(p+162),SH:u16(p+164),HR:d[p+166],D:d[p+167],T:d[p+168],E:d[p+169]}});
  }
  out.year=d[YEARO]+1;
  return out;
}
function reKey(all){
  // 転生: 同じ選手データで年齢が前回より下がっていたら別人（2代目以降）として扱う
  const last={};for(const se of DB.seasons)for(const p of se.players){const b=p.base||p.key,g=p.gen||0;const o=last[b];if(!o||g>o.gen||g===o.gen)last[b]={gen:g,age:p.age}}
  for(const r of all){if(r.base)continue;const b=r.key,o=last[b];let g=o?o.gen:0;if(o&&r.age<o.age)g++;r.base=b;r.gen=g;if(g)r.key=b+'~'+g}
}
function buildSeason(all){
  reKey(all);
  const mine=all.filter(r=>r.team===MY);
  const mineKeys=new Set(mine.map(r=>r.key));
  let prev;
  if(DB.seasons.length){const last=DB.seasons[DB.seasons.length-1];prev=new Set(last.players.filter(p=>!p.moved).map(p=>p.key))}
  else prev=new Set(SEED_ROSTER);
  const moved=all.filter(r=>r.team!==MY&&prev.has(r.key)&&!mineKeys.has(r.key));
  if(DB.seasons.length){const last=DB.seasons[DB.seasons.length-1];const rl={};last.players.forEach(p=>{if(p.role)rl[p.key]=p.role});mine.forEach(r=>{if(rl[r.key])r.role=rl[r.key]})}
  return mine.map(r=>({...r,moved:false})).concat(moved.map(r=>({...r,moved:true})));
}

// ---------- 簡易WAR（リーグ＝そのシーズンに試合をした球団。守備は失策のみ、外野は一括） ----------
const POSADJ=[0,12.5,-12.5,2.5,2.5,7.5,-4.2];// 162試合あたりの守備位置補正（点）
function computeWAR(all){
  const lgT=new Set();for(const r of all)if(r.pit.outs>0)lgT.add(r.team);
  const L=all.filter(r=>lgT.has(r.team));if(!L.length)return null;
  let R=0,outs=0,HR=0,BB=0,K=0;for(const r of L){R+=r.pit.R;outs+=r.pit.outs;HR+=r.pit.HR;BB+=r.pit.BB;K+=r.pit.K}
  const B=L.filter(r=>r.pos!==0&&r.bat.PA>0);
  const raw=b=>.69*b.BB+.89*(b.H-b.D-b.T-b.HR)+1.27*b.D+1.62*b.T+2.10*b.HR,den=b=>b.PA-b.SH;
  let rn=0,dn=0,PA=0,allPA=0;const eG={},gG={};for(const r of L)allPA+=r.bat.PA;
  for(const r of B){rn+=raw(r.bat);dn+=den(r.bat);PA+=r.bat.PA;eG[r.pos]=(eG[r.pos]||0)+r.bat.E;gG[r.pos]=(gG[r.pos]||0)+r.G}
  const eRate={};for(const k in gG)eRate[k]=eG[k]/gG[k];
  const dS={},aS={};for(const r of B){dS[r.pos]=(dS[r.pos]||0)+r.rng*r.G;aS[r.pos]=(aS[r.pos]||0)+r.apt[r.pos-1]*r.G}
  const dAvg={},aAvg={};for(const k in gG){dAvg[k]=dS[k]/gG[k];aAvg[k]=aS[k]/gG[k]}
  const IP=outs/3,RA9=R*9/IP,RPW=9*(R/IP)*1.5+3,f=(R/allPA)/0.115,lgRaw=rn/dn;
  const games=lgT.size*140/2,pool=570*games/2430;
  const repPA=pool*0.57*RPW/PA,repOut=pool*0.43/outs;
  const C=RA9-(13*HR+3*BB-2*K)/IP;
  for(const r of all){
    const b=r.bat,q=r.pit;
    if(r.pos!==0&&b.PA>0){
      const bat=(raw(b)/Math.max(1,den(b))-lgRaw)*den(b)/1.2*f;
      const pos=(POSADJ[r.pos]||0)*r.G/162*f;
      const fld=-(b.E-(gG[r.pos]?eG[r.pos]/gG[r.pos]:0)*r.G)*0.75*f;
      b.Rbat=bat;b.Rfld0=fld;b.Rrep=repPA*b.PA;applyRole(r,{RPW,f,eRate,dAvg,aAvg});
    }
    if(q.outs>0){const ip=q.outs/3,fip=(13*q.HR+3*q.BB-2*q.K)/ip+C;q.Cfo=C*q.outs;q.WAR=(RA9-fip)*ip/9/RPW+repOut*q.outs}
  }
  return{teams:lgT.size,RA9,RPW,C,f,eRate,dAvg,aAvg};
}
// 役割の上書き：DH＝守備なし（補正−17.5、失策は数えない）、CF＝中堅（補正+2.5）
const ROLES=[['','登録通り'],['p1','捕'],['p2','一'],['p3','二'],['p4','三'],['p5','遊'],['p6','外'],['CF','中堅'],['DH','DH']];
function posL(p){return p.role==='DH'?'DH':p.role==='CF'?'中':POS[rolePos(p)]}
function rolePos(r){return r.role==='CF'?6:r.role&&r.role[0]==='p'?+r.role[1]:r.pos}
function applyRole(r,lg){const b=r.bat;if(b.Rbat===undefined||!lg)return;
  const ps=rolePos(r),adj=r.role==='DH'?-17.5:r.role==='CF'?2.5:(POSADJ[ps]||0);
  b.Rpos=adj*r.G/162*lg.f;
  b.Rfld=r.role==='DH'?0:(lg.eRate?-(b.E-(lg.eRate[ps]||0)*r.G)*0.75*lg.f:b.Rfld0);
  b.Rdef=(r.role==='DH'||!lg.dAvg||r.rng===undefined)?0:(r.rng-(lg.dAvg[ps]||r.rng))*0.6*r.G/140*lg.f;
  b.Rapt=(r.role==='DH'||!lg.aAvg||!r.apt||!(ps>=1&&ps<=6))?0:(r.apt[ps-1]-(lg.aAvg[ps]||0))*0.4*r.G/140*lg.f;
  b.WAR=(b.Rbat+b.Rpos+b.Rfld+b.Rdef+b.Rapt+b.Rrep)/lg.RPW}
function fipOf(q){return((13*q.HR+3*q.BB-2*q.K)*3+q.Cfo)/q.outs}

// ---------- 自動タイトル（成績で決まるものだけ。リーグ全球団から判定） ----------
function autoTitles(all){
  const lgT=new Set();for(const r of all)if(r.pit.outs>0)lgT.add(r.team);
  const L=all.filter(r=>lgT.has(r.team));if(!L.length)return[];
  const G=Math.max(...L.map(r=>r.G)),qPA=Math.round(G*3.1),qOut=G*3;
  const AB=b=>b.PA-b.BB-b.SH,obp=b=>(b.H+b.BB)/(AB(b)+b.BB);
  const out=[];
  const best=(title,pool,val,low=false)=>{pool=pool.filter(r=>isFinite(val(r)));if(!pool.length)return;let v=low?Math.min(...pool.map(val)):Math.max(...pool.map(val));if(!low&&v<=0)return;pool.filter(r=>val(r)===v).forEach(r=>out.push({key:r.key,title,name:r.gname,team:r.team}))};
  const qb=L.filter(r=>r.bat.PA>=qPA),qp=L.filter(r=>r.pit.outs>=qOut);
  best('首位打者',qb,r=>r.bat.H/AB(r.bat));
  best('本塁打王',L,r=>r.bat.HR);
  best('打点王',L,r=>r.bat.RBI);
  best('盗塁王',L,r=>r.bat.SB);
  best('最多安打',L,r=>r.bat.H);
  best('最高出塁率',qb,r=>obp(r.bat));
  best('最多勝',L,r=>r.pit.W);
  best('最優秀防御率',qp,r=>r.pit.ER/r.pit.outs,true);
  best('最多奪三振',L,r=>r.pit.K);
  best('最多セーブ',L,r=>r.pit.S);
  best('最高勝率',L.filter(r=>r.pit.W>=13),r=>r.pit.W/(r.pit.W+r.pit.L));
  return out;
}

  return{G,PA:b.PA,AB,H:b.H,D:b.D,T:b.T,HR:b.HR,RBI:b.RBI,SB:b.SB,BB:b.BB,K:b.K,SH:b.SH,E:b.E,AVG:avg,OBP:obp,SLG:slg,OPS:obp+slg,WAR:b.WAR,Rbat:b.Rbat,Rpos:b.Rpos,Rfld:b.Rfld,Rdef:b.Rdef,Rapt:b.Rapt}}

const BATCOL=[['G','試合'],['PA','打席'],['AB','打数'],['H','安打'],['D','二塁打'],['T','三塁打'],['HR','本塁打'],['RBI','打点'],['SB','盗塁'],['BB','四死球'],['K','三振'],['SH','犠打飛'],['E','失策'],['AVG','打率',r3],['OBP','出塁率',r3],['SLG','長打率',r3],['OPS','OPS',r3],['Rbat','打撃(点)',r1],['Rpos','守備位置(点)',r1],['Rfld','失策(点)',r1],['Rdef','守備力(点)',r1],['Rapt','適性(点)',r1],['WAR','WAR',r1]];
const PITCOL=[['G','試合'],['W','勝'],['L','敗'],['S','S'],['outs','投球回',ip],['ERA','防御率',r2],['K','奪三振'],['H','被安打'],['BB','与四死球'],['HR','被本塁打'],['K9','K/9',r2],['BB9','BB/9',r2],['HR9','HR/9',r2],['WHIP','WHIP',r2],['KBB','K/BB',r2],['FIP','FIP',r2],['WAR','WAR',r1]];
function careers(){
  const m=new Map();
  DB.seasons.forEach((s,si)=>s.players.forEach(p=>{
    let c=m.get(p.key);if(!c){c={key:p.key,p,bat:{},pit:{},bG:0,pG:0,bY:0,pY:0,seasons:[]};m.set(p.key,c)}
    c.p=p;c.seasons.push({si,p});
    if(isBat(p)){addObj(c.bat,p.bat);c.bG+=p.G;c.bY++}
    if(p.pit.outs>0){addObj(c.pit,p.pit);c.pG+=p.G;c.pY++}
  }));
  return[...m.values()];
}

let sortState={};
function table(id,cols,rows,{first='選手',extra=[],tot=null,defSort=null}={}){
  const st=sortState[id]||(defSort?{k:defSort,d:-1}:null);
  const allc=extra.concat(cols);
  if(st)rows=rows.slice().sort((a,b)=>{const x=a.v[st.k],y=b.v[st.k];const xv=typeof x==='number'&&isFinite(x)?x:-1e9,yv=typeof y==='number'&&isFinite(y)?y:-1e9;return typeof x==='string'?st.d*String(x).localeCompare(String(y),'ja'):st.d*(xv-yv)});
  let h=`<div class="tw"><table data-t="${id}"><thead><tr><th>${first}</th>`+allc.map(c=>`<th data-k="${c[0]}" class="${st&&st.k===c[0]?'sorted':''}">${c[1]}</th>`).join('')+'</tr></thead><tbody>';
  const cell=(c,v)=>`<td>${c[2]?c[2](v[c[0]]):(v[c[0]]??'')}</td>`;
  for(const r of rows)h+=`<tr><td>${r.label}</td>`+allc.map(c=>cell(c,r.v)).join('')+'</tr>';
  if(tot)h+=`<tr class="tot"><td>${tot.label}</td>`+allc.map(c=>cell(c,tot.v)).join('')+'</tr>';

function yearNote(P){if(!P.year)return '';const ys=DB.seasons.filter(s=>s.year).map(s=>s.year);let h=`<p class="muted">ゲーム内の年数から <b>${P.year}年目</b> のデータと判定しました。</p>`;

  const miss=[];if(ys.length){const mx=Math.max(...ys,P.year),mn=Math.min(...ys,P.year);for(let y=mn;y<=mx;y++)if(y!==P.year&&!ys.includes(y))miss.push(y)}
  if(miss.length)h+=`<p class="muted">記録がない年：${miss.map(y=>y+'年目').join('、')}</p>`;

function commit(){

  document.querySelectorAll('[data-role]').forEach(sel=>{const p=P.players[+sel.dataset.role];p.role=sel.value||undefined;applyRole(p,P.lg)});
  const inc=new Set([...document.querySelectorAll('[data-inc]')].filter(c=>c.checked).map(c=>+c.dataset.inc));
  const players=P.players.filter((p,i)=>inc.has(i)).map(({key,base,gen,team,id,age,rng,ab,gt,apt,pos,role,codes,gname,G,pit,bat,moved,tv,pa})=>({key,base,gen,team,id,age,rng,ab,gt,apt,pos,role,codes,gname,G,pit,bat,moved,tv,pa}));
  const sig=JSON.stringify(players.map(p=>[p.key,p.G,p.bat.PA,p.pit.outs]));
  if(DB.seasons.some(s=>s.sig===sig)&&!confirm('同じ内容のシーズンがもう保存されています。それでも追加しますか？'))return;
  const ex=DB.seasons.findIndex(s=>s.label===label);

  DB.titles=DB.titles.filter(t=>!(t.auto&&t.season===label));const ks=new Set(players.map(p=>p.key));(P.autoT||[]).filter(t=>ks.has(t.key)).forEach(t=>DB.titles.push({season:label,key:t.key,title:t.title,auto:true}));
  save();cur.pending=null;cur.season=label;go('season');
}

const PAL=['球威','制球','体力','?91'];
function dcell(a,b,dig){const dd=(b!==undefined&&b!==null&&a!==undefined)?Math.round((a-b)*Math.pow(10,dig))/Math.pow(10,dig):null;

function pitBox(c){const ss=c.seasons.filter(x=>x.p.pa);if(!ss.length)return '<p class="muted">能力値：このシーズンを読み直すと表示されます。</p>';

  const T=['MVP','新人王','ベストナイン','ゴールデングラブ','沢村賞'];
  return `<div class="card"><h2>タイトルを記録</h2>
  <div class="row"><select id="ts">${DB.seasons.map(s=>`<option>${esc(s.label)}</option>`).join('')}</select>
  <select id="tp">${cs.map(c=>`<option value="${c.key}">${esc(nm(c.p))}</option>`).join('')}</select></div>
  <div class="row"><button class="btn sub" onclick="document.getElementById('tt').value='MVP';addTitle()">MVP</button><button class="btn sub" onclick="document.getElementById('tt').value='新人王';addTitle()">新人王</button><input type="text" id="tt" list="tl" placeholder="タイトル名" style="width:12em"><datalist id="tl">${T.map(t=>`<option value="${t}">`).join('')}</datalist>
  <button class="btn" onclick="addTitle()">追加</button></div></div>
  <div class="card"><h2>記録済み（${DB.titles.length}）</h2><div class="list">${DB.titles.map((t,i)=>{const c=cs.find(x=>x.key===t.key);return `<div><span>${esc(t.season)}　${c?plink(c.p):'?'}　${esc(t.title)}</span><button class="btn warn" onclick="DB.titles.splice(${i},1);save();render()">削除</button></div>`}).join('')||'<span class="muted">まだありません</span>'}</div></div>`};
function addTitle(){const t=document.getElementById('tt').value.trim();if(!t)return;DB.titles.push({season:document.getElementById('ts').value,key:document.getElementById('tp').value,title:t});save();render()}
V.data=()=>{
  const cs=careers().sort((a,b)=>nm(a.p).localeCompare(nm(b.p),'ja'));
  return `<div class="card"><h2>書き出し</h2>
  <button class="btn" onclick="csv('bat')">通算 野手 CSV</button><button class="btn" onclick="csv('pit')">通算 投手 CSV</button><button class="btn" onclick="csv('season')">全シーズン明細 CSV</button>
  <p class="muted">CSVはExcel・Googleスプレッドシートでそのまま開けます。</p></div>
  <div class="card"><h2>記録の切り替え</h2><p class="muted">周回ごとに別の記録を持てます。覚えた字はすべての記録で共通です。</p>
  <div class="list">${Object.entries(ST.records).map(([id,r])=>`<div><span>${id===ST.active?'▶ ':''}${esc(r.name)} <span class="muted">${r.seasons.length}シーズン</span></span>${id===ST.active?'<span class="muted">使用中</span>':`<button class="btn sub" onclick="useRec('${id}')">切り替え</button>`}</div>`).join('')}</div>
  <button class="btn" onclick="newRec()">新しい記録を作る</button><button class="btn sub" onclick="renRec()">名前変更</button><button class="btn warn" onclick="delRec()">この記録を削除</button></div>
  <div class="card"><h2>バックアップ</h2><p class="muted">データはこのブラウザの中だけに保存されます。機種変更やキャッシュ削除に備えて、ときどき保存してください。バックアップには全部の記録と覚えた字が入ります。</p>
  <button class="btn" onclick="backup()">バックアップを保存</button><button class="btn sub" onclick="document.getElementById('restore').click()">バックアップから復元</button></div>
  <div class="card"><h2>名前の修正</h2><div class="list">${cs.map(c=>`<div><span class="${nm(c.p).includes('□')?'unk':''}">${POS[c.p.pos]||''}</span><input type="text" value="${esc(nm(c.p))}" onchange="setName('${c.key}',this.value)" style="flex:1"></div>`).join('')||'<span class="muted">なし</span>'}</div></div>
  <div class="card"><h2>覚えた字（${Object.keys(GLY).length}）</h2><div>${Object.entries(GLY).map(([c,ch])=>`<button class="btn sub" onclick="delGly('${c}')">${esc(ch)}</button>`).join('')||'<span class="muted">まだありません</span>'}</div><p class="muted">最初から読める字：${esc([...new Set(Object.values(GLYPH))].join(''))}</p></div>
  <div class="card"><h2>シーズン管理</h2><div class="list">${DB.seasons.map((s,i)=>`<div><span>${esc(s.label)} <span class="muted">${s.players.length}人</span></span><span><button class="btn sub" onclick="ren(${i})">名前変更</button><button class="btn warn" onclick="delS(${i})">削除</button></span></div>`).join('')||'<span class="muted">なし</span>'}</div></div>`};
function setName(k,v){v=v.trim();let p=null;for(const s of DB.seasons)for(const x of s.players)if(x.key===k&&x.codes)p=x;const n=p?learn(p.codes,v):0;const g=p?decode(p.codes):'';if(v&&v!==g)DB.names[k]=v;else delete DB.names[k];save();if(n)render()}
function ren(i){const v=prompt('シーズン名',DB.seasons[i].label);if(!v)return;const old=DB.seasons[i].label;DB.seasons[i].label=v;DB.titles.forEach(t=>{if(t.season===old)t.season=v});save();render()}
function delS(i){if(!confirm(`「${DB.seasons[i].label}」を削除しますか？`))return;DB.seasons.splice(i,1);save();render()}
function dl(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function csvText(head,rows){const q=v=>{v=v===undefined||v===null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};return '\ufeff'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n')}
const fmtv=(c,v)=>c[2]?c[2](v[c[0]]):v[c[0]];
function csv(kind){const cs=careers();
  if(kind==='bat'){const rows=cs.filter(c=>c.bat.PA>0).map(c=>{const v=batRow(c.bat,c.bG);return[nm(c.p),POS[c.p.pos],c.bY,...BATCOL.map(k=>fmtv(k,v))]});dl('通算_野手.csv',csvText(['選手','守','年',...BATCOL.map(c=>c[1])],rows),'text/csv')}
  if(kind==='pit'){const rows=cs.filter(c=>c.pit.outs>0).map(c=>{const v=pitRow(c.pit,c.pG);return[nm(c.p),c.pY,...PITCOL.map(k=>fmtv(k,v))]});dl('通算_投手.csv',csvText(['選手','年',...PITCOL.map(c=>c[1])],rows),'text/csv')}
  if(kind==='season'){const rows=[];DB.seasons.forEach(s=>s.players.forEach(p=>{const b=batRow(p.bat,p.G),q=pitRow(p.pit,p.G);rows.push([s.label,nm(p),posL(p),p.age,p.moved?'移籍':'',p.G,...BATCOL.slice(1).map(k=>p.bat.PA?fmtv(k,b):''),...PITCOL.slice(1).map(k=>p.pit.outs?fmtv(k,q):'')])}));
    dl('シーズン明細.csv',csvText(['シーズン','選手','守','年齢','備考','試合',...BATCOL.slice(1).map(c=>c[1]),...PITCOL.slice(1).map(c=>'投_'+c[1])],rows),'text/csv')}
}
function backup(){dl('通算成績_バックアップ_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({v:2,store:ST,glyph:GLY}),'application/json')}
document.getElementById('restore').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const j=JSON.parse(await f.text());if(j.v===2&&j.store&&j.store.records){const n=Object.keys(j.store.records).length;if(!confirm(`記録${n}件で今のデータをすべて置き換えますか？`))return;ST=j.store;Object.assign(GLY,j.glyph||{});saveGly();if(!ST.records[ST.active])ST.active=Object.keys(ST.records)[0];useRec(ST.active);return}
  if(!j.seasons)throw 0;if(j.glyph){Object.assign(GLY,j.glyph);saveGly();delete j.glyph}if(!confirm(`${j.seasons.length}シーズン分を新しい記録として追加しますか？`))return;const id=newId();ST.records[id]={...blank('復元した記録'),...j};useRec(id)}catch(err){alert('バックアップファイルを読めませんでした')}});
render();
</script>
</body>
</html>
